name: dbt CI

on:
  push:
    branches:
      - main

jobs:
  dbt-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dbt
        run: pip install dbt-snowflake

      # ✅ Validate secrets (MATCHES SECRET_1/2/3)
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.SECRET_1 }}" ]; then echo "SECRET_1 missing"; exit 1; fi
          if [ -z "${{ secrets.SECRET_2 }}" ]; then echo "SECRET_2 missing"; exit 1; fi
          if [ -z "${{ secrets.SECRET_3 }}" ]; then echo "SECRET_3 missing"; exit 1; fi
          echo "✅ Secrets available"

      # ✅ Create dbt profile
      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          tpch_analytics:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: "${{ secrets.SECRET_1 }}"
                user: "${{ secrets.SECRET_2 }}"
                password: "${{ secrets.SECRET_3 }}"
                role: "DBT_ROLE"
                database: "DBT_DEV"
                warehouse: "COMPUTE_WH"
                schema: "PUBLIC"
                threads: 4
          EOF

      - name: dbt deps
        run: dbt deps --profiles-dir ~/.dbt

      - name: dbt build
        run: dbt build --profiles-dir ~/.dbt