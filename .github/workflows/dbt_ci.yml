name: dbt CI

on:
  pull_request:

jobs:
  dbt-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          tpch_analytics:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: "$DBT_SNOWFLAKE_ACCOUNT"
                user: "$DBT_SNOWFLAKE_USER"
                password: "$DBT_SNOWFLAKE_PASSWORD"
                role: "DBT_ROLE"
                database: "DBT_DEV"
                warehouse: "COMPUTE_WH"
                schema: "PUBLIC"
                threads: 4
          EOF

      - name: dbt deps
        run: dbt deps

      - name: dbt build
        run: dbt build

    env:
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
      DBT_SNOWFLAKE_USER: ${{ secrets.SF_USER }}
      DBT_SNOWFLAKE_PASSWORD: ${{ secrets.SF_PASSWORD }}