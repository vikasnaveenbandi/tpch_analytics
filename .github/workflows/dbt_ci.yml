name: dbt CI

on:
  push:
    branches:
      - main
      - feature/*

jobs:
  dbt-test:
    runs-on: ubuntu-latest

    env:
      DBT_SNOWFLAKE_ACCOUNT: "NLGTOEW-JN81924"
      DBT_SNOWFLAKE_USER: "SNOWDBTV2"
      DBT_SNOWFLAKE_PASSWORD: "Applelife@@2026"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dbt
        run: pip install dbt-snowflake

      # ✅ Debug step (remove later if you want)
      - name: Debug env variables
        run: |
          echo "ACCOUNT=$DBT_SNOWFLAKE_ACCOUNT"
          echo "USER=$DBT_SNOWFLAKE_USER"

      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          tpch_analytics:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: "{{ env_var('DBT_SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('DBT_SNOWFLAKE_USER') }}"
                password: "{{ env_var('DBT_SNOWFLAKE_PASSWORD') }}"
                role: "DBT_ROLE"
                database: "DBT_DEV"
                warehouse: "COMPUTE_WH"
                schema: "PUBLIC"
                threads: 4
          EOF

      - name: dbt deps
        run: dbt deps

      - name: dbt build
        run: dbt build